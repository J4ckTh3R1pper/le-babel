spring:
  application:
    name: 'chat_springboot'
  datasource:
    url: 'jdbc:mariadb://localhost:3306/lebabel?user=lebabel&password=123456&&useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&autoReconnect=true&failOverReadOnly=false'
    hikari:
      driver-class-name: 'org.mariadb.jdbc.Driver'
  mvc:
    view:
      prefix: '/WEB-INF/jsp/'
      suffix: '.jsp'
  servlet:
    multipart:
      max-file-size: 128MB
  web:
    resources:
      static-locations:
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/dist/
        - classpath:/public/
        - file:${dayp308.chatroom.fileStorePath}
        - file:${dayp308.chatroom.resourcePath}
  jpa:
    properties:
      hibernate:
        format_sql: true
        jdbc:
          fetch_size: 1048576

